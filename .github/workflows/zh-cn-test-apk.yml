name: zh-CN test APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zh-cn-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Install test and runtime preparation dependencies
        run: |
          npm ci --ignore-scripts
          python3 -m pip install -r tools/requirements-devtools.txt

      - name: Run UI tests, including zh-CN locale tests
        run: npm test

      - name: Refresh and prepare Android runtimes
        run: |
          sdkmanager 'ndk;28.2.13676358'
          python3 tools/prepare_runtime.py
          python3 tools/build_native.py --ndk "$ANDROID_HOME/ndk/28.2.13676358"
          python3 tools/prepare_devtools.py --write-lock
          python3 tools/prepare_devtools.py

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-codex-zh-cn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
